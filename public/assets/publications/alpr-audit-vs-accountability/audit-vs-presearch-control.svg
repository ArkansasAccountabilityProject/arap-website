<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720"><rect width="1400" height="720" fill="white"/><text x="700" y="60" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700">Audit vs. Preventive Accountability</text><rect x="70" y="120" width="580" height="500" rx="22" fill="#f5f5f5" stroke="#333" stroke-width="3"/><text x="360" y="165" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700">After-the-Fact Audit</text><text x="360" y="220" text-anchor="middle" font-family="Arial" font-size="24">Search executes</text><text x="360" y="270" text-anchor="middle" font-family="Arial" font-size="30">↓</text><text x="360" y="320" text-anchor="middle" font-family="Arial" font-size="24">Data is accessed</text><text x="360" y="370" text-anchor="middle" font-family="Arial" font-size="30">↓</text><text x="360" y="420" text-anchor="middle" font-family="Arial" font-size="24">Audit log records activity</text><text x="360" y="470" text-anchor="middle" font-family="Arial" font-size="30">↓</text><text x="360" y="520" text-anchor="middle" font-family="Arial" font-size="24">Review occurs later</text><text x="360" y="575" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">Traceability after access</text><rect x="750" y="120" width="580" height="500" rx="22" fill="#f5f5f5" stroke="#333" stroke-width="3"/><text x="1040" y="165" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700">Preventive Accountability</text><text x="1040" y="215" text-anchor="middle" font-family="Arial" font-size="22">Purpose documented</text><text x="1040" y="255" text-anchor="middle" font-family="Arial" font-size="28">↓</text><text x="1040" y="300" text-anchor="middle" font-family="Arial" font-size="22">Scope defined</text><text x="1040" y="340" text-anchor="middle" font-family="Arial" font-size="28">↓</text><text x="1040" y="385" text-anchor="middle" font-family="Arial" font-size="22">Approval where required</text><text x="1040" y="425" text-anchor="middle" font-family="Arial" font-size="28">↓</text><text x="1040" y="470" text-anchor="middle" font-family="Arial" font-size="22">Search executes</text><text x="1040" y="510" text-anchor="middle" font-family="Arial" font-size="28">↓</text><text x="1040" y="555" text-anchor="middle" font-family="Arial" font-size="22">Audit verifies compliance</text><text x="700" y="680" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700">Audit asks “What happened?” • Preventive control asks “What must happen before access?”</text></svg>