<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="430" viewBox="0 0 1500 430"><rect width="1500" height="430" fill="white"/><text x="750" y="58" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700">Integrated ALPR Accountability Chain</text><g font-family="Arial" font-size="18" text-anchor="middle"><text x="100" y="200">Lawful purpose</text><text x="285" y="200">Documentation</text><text x="470" y="200">Authorization</text><text x="655" y="200">Technical controls</text><text x="840" y="200">Search</text><text x="1025" y="200">Audit</text><text x="1210" y="200">Review</text><text x="1390" y="200">Reporting / correction</text></g><g font-family="Arial" font-size="30" text-anchor="middle"><text x="192" y="200">→</text><text x="377" y="200">→</text><text x="562" y="200">→</text><text x="747" y="200">→</text><text x="932" y="200">→</text><text x="1117" y="200">→</text><text x="1300" y="200">→</text></g><text x="750" y="300" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">Preventive controls operate before or during access; auditing and reporting verify afterward.</text><text x="750" y="345" text-anchor="middle" font-family="Arial" font-size="21">A gap at one stage is not automatically cured by strength at another.</text></svg>